[workspace]
members = [
    "crates/omibus-core",
    "src-tauri",
    "future-live/crates/omnibus-core",
    "future-live/crates/omnibus-exchange",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio       = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = "0.8"

# HTTP + WebSocket
reqwest          = { version = "0.12", features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util     = "0.3"

# Crypto
hmac   = "0.12"
sha2   = "0.10"
sha1   = "0.10"
base64 = "0.22"
hex    = "0.4"

# Error / logging / time
thiserror    = "2.0"
tracing      = "0.1"
chrono       = "0.4"

# Concurrency
dashmap     = "6.1"
parking_lot = "0.12"
