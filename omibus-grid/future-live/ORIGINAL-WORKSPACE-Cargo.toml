[workspace]
members = ["crates/*", "crates/omnibus-ui-tauri/src-tauri", "crates/omnibus-mm"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["OmniBus Team"]
license = "MIT"
repository = "https://github.com/omnibus/terminal"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Crypto
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = "0.4"

# UI
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
egui_extras = "0.29"

# Image handling
image = "0.25"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["full"] }