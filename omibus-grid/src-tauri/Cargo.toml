[package]
name = "omibus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
omibus-core      = { path = "../crates/omibus-core" }
omnibus-core     = { path = "../future-live/crates/omnibus-core" }
omnibus-exchange = { path = "../future-live/crates/omnibus-exchange" }

tauri      = { version = "=2.11.5", features = [] }
serde      = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# Async runtime (needed for exchange commands)
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Crypto
aes-gcm   = "0.10"
pbkdf2    = { version = "0.12", features = ["hmac"] }
sha2      = "0.10"
hmac      = "0.12"
rand      = "0.8"
hex       = "0.4"
parking_lot = "0.12"
