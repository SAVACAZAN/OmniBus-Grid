
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omibus Grid</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./shell.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Application navigation">
      <div class="brand-mark">O<span>.</span></div>
      <div class="rail-line"></div>
      <nav id="module-nav" class="module-nav" aria-label="Modules"></nav>
      <div class="rail-bottom" id="module-label">OMIBUS</div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="brand-name">OMIBUS <span>/ WORKSPACE</span></div>
        <div class="topbar-right"><span class="pulse"></span> LOCAL PAPER ENGINE <span class="divider"></span><span id="clock">—</span></div>
      </header>
      <div id="shell-message" class="shell-message" role="status" aria-live="polite">Loading workspace…</div>
      <div id="module-pages"></div>
    </div>
  </div>
</body>
</html>
